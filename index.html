    <script>
      (function() {
        try {
          var theme = localStorage.getItem('omniplan_theme');
          var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
          var style = localStorage.getItem('omniplan_theme_style');
          document.documentElement.classList.add(style === 'glass' ? 'theme-glass' : 'theme-bento');
          var accent = localStorage.getItem('omniplan_accent_tone') || 'indigo';
          document.documentElement.setAttribute('data-accent', accent);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
