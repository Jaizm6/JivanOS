<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>JivanOS — Personal Life, Health, Habit & Productivity Operating System</title>
    <meta name="description" content="Unified personal life OS combining HabitTick habits, TickTick-style Eisenhower & Kanban tasks, medication reminders, bills tracker, and AES-256 encrypted journal." />
    <meta property="og:title" content="JivanOS — Personal Life, Health, Habit & Productivity Operating System" />
    <meta property="og:description" content="Unified personal life OS combining HabitTick habits, TickTick-style Eisenhower & Kanban tasks, medication reminders, bills tracker, and AES-256 encrypted journal." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f0f4f9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JivanOS" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Google Fonts: Non-render-blocking load so typography never delays first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('omniplan_theme');
          var isDark = saved === 'dark';
          var savedStyle = localStorage.getItem('omniplan_theme_style') || 'bento';
          var validStyles = ['bento', 'glass', 'pastel', 'neumorphic', 'claymorphic', 'standard', 'sea-glass'];
          if (validStyles.indexOf(savedStyle) === -1) savedStyle = 'bento';
          var savedTone = localStorage.getItem('omniplan_accent_tone') || 'indigo';
          document.documentElement.classList.add('theme-' + savedStyle);
          document.documentElement.setAttribute('data-accent', savedTone);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      #initial-boot-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      html.dark #initial-boot-shell {
        background: #000000;
        color: #f8fafc;
      }
      .boot-nav {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      }
      .boot-pill {
        height: 36px;
        border-radius: 14px;
        background: rgba(148, 163, 184, 0.12);
        margin: 8px 12px 4px;
      }
      .boot-card {
        height: 46px;
        border-radius: 16px;
        background: rgba(148, 163, 184, 0.1);
        margin: 4px 12px;
        animation: bootPulse 1.4s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.9; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-boot-shell" aria-hidden="true">
        <div class="boot-nav">
          <div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;">
            <span style="width:18px;height:2px;background:currentColor;display:inline-block;border-radius:2px;box-shadow:0 -5px 0 currentColor, 0 5px 0 currentColor;"></span>
            <span>Tasks</span>
          </div>
        </div>
        <div class="boot-pill"></div>
        <div class="boot-card"></div>
        <div class="boot-card"></div>
        <div class="boot-card"></div>
        <div class="boot-card"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
