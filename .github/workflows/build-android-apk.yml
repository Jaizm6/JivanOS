name: Build JivanOS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK 34
        run: |
          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
            sudo chown -R $USER:$USER "$SDK_ROOT"
          else
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager | head -n 1)
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Dependencies, Generate JivanOS Icons & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps react-is postcss
          node -e '
            const sharp = require("sharp");
            const fs = require("fs");
            const svg = fs.readFileSync("public/icon.svg");
            Promise.all([
              sharp(svg).resize(64, 64).png().toFile("public/favicon.png"),
              sharp(svg).resize(180, 180).png().toFile("public/apple-touch-icon.png"),
              sharp(svg).resize(192, 192).png().toFile("public/pwa-192x192.png"),
              sharp(svg).resize(512, 512).png().toFile("public/pwa-512x512.png"),
              sharp(svg).resize(512, 512).png().toFile("public/pwa-maskable-512x512.png")
            ]).then(() => console.log("Web & PWA icons generated from public/icon.svg"));
          '
          npm run build

      - name: Package Web Bundle into Native Android Project (Capacitor 6)
        run: |
          rm -rf /tmp/cap-project
          mkdir -p /tmp/cap-project
          cp -r "$GITHUB_WORKSPACE/dist" /tmp/cap-project/dist
          cp "$GITHUB_WORKSPACE/capacitor.config.json" /tmp/cap-project/capacitor.config.json
          cd /tmp/cap-project
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap add android
          npx cap sync android

          # Apply JivanOS geometric launcher icon across all Android mipmap densities
          node -e '
            const sharp = require("'"$GITHUB_WORKSPACE"'/node_modules/sharp");
            const fs = require("fs");
            const path = require("path");
            const svg = fs.readFileSync("'"$GITHUB_WORKSPACE"'/public/icon.svg");
            const resDir = "/tmp/cap-project/android/app/src/main/res";
            const mipmaps = [
              { dir: "mipmap-mdpi", size: 48, fg: 108 },
              { dir: "mipmap-hdpi", size: 72, fg: 162 },
              { dir: "mipmap-xhdpi", size: 96, fg: 216 },
              { dir: "mipmap-xxhdpi", size: 144, fg: 324 },
              { dir: "mipmap-xxxhdpi", size: 192, fg: 432 },
            ];
            (async () => {
              for (const m of mipmaps) {
                const targetDir = path.join(resDir, m.dir);
                fs.mkdirSync(targetDir, { recursive: true });
                await sharp(svg).resize(m.size, m.size).png().toFile(path.join(targetDir, "ic_launcher.png"));
                await sharp(svg).resize(m.size, m.size).png().toFile(path.join(targetDir, "ic_launcher_round.png"));
                await sharp(svg).resize(m.fg, m.fg).png().toFile(path.join(targetDir, "ic_launcher_foreground.png"));
              }
              const bgXml = path.join(resDir, "values/ic_launcher_background.xml");
              if (fs.existsSync(bgXml)) {
                fs.writeFileSync(bgXml, "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"ic_launcher_background\">#090D16</color>\n</resources>\n");
              }
              console.log("Android native mipmap launcher icons updated with JivanOS emblem.");
            })();
          '

          # Decode persistent repository keystore so every release shares the exact same signing certificate
          mkdir -p "$HOME/.android"
          if [ ! -f "$GITHUB_WORKSPACE/android-signing/debug.keystore.b64" ]; then
            echo "ERROR: Missing android-signing/debug.keystore.b64"
            exit 1
          fi
          base64 -d "$GITHUB_WORKSPACE/android-signing/debug.keystore.b64" > /tmp/jivanos-release.keystore
          cp /tmp/jivanos-release.keystore "$HOME/.android/debug.keystore"
          keytool -list -v -keystore /tmp/jivanos-release.keystore -storepass android -alias androiddebugkey | head -n 20

          # Deterministically set versionCode (30000+run_number), versionName (3.0.x), and explicit release/debug signingConfigs
          VER_CODE=$((30000 + ${GITHUB_RUN_NUMBER:-1}))
          VER_NAME="3.0.${GITHUB_RUN_NUMBER:-1}"
          echo "JIVANOS_VER_NAME=$VER_NAME" >> $GITHUB_ENV
          echo "JIVANOS_VER_CODE=$VER_CODE" >> $GITHUB_ENV

          node -e '
            const fs = require("fs");
            const gradlePath = "/tmp/cap-project/android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const verCode = Number(process.env.JIVANOS_VER_CODE || 30001);
            const verName = process.env.JIVANOS_VER_NAME || "3.0.1";

            gradle = gradle.replace(/applicationId\s+"[^"]+"/, "applicationId \"com.jivanos.lifesystem\"");
            gradle = gradle.replace(/versionCode\s+\d+/, "versionCode " + verCode);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, "versionName \"" + verName + "\"");

            const signingBlock = `
    signingConfigs {
        debug {
            storeFile file("/tmp/jivanos-release.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            storeFile file("/tmp/jivanos-release.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
`;
            gradle = gradle.replace(/buildTypes\s*\{/, signingBlock + "\n    buildTypes {");
            gradle = gradle.replace(/(release\s*\{)/, "$1\n            signingConfig signingConfigs.release");
            gradle = gradle.replace(/(debug\s*\{)/, "$1\n            signingConfig signingConfigs.debug");
            if (!gradle.includes("debug {")) {
              gradle = gradle.replace(/buildTypes\s*\{/, "buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }");
            }
            fs.writeFileSync(gradlePath, gradle, "utf8");
            console.log("Updated build.gradle -> versionCode=" + verCode + ", versionName=" + verName + ", explicit signingConfigs attached");
          '

          MANIFEST="/tmp/cap-project/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application|g' "$MANIFEST"
          fi

      - name: Compile & Verify Signed Release Android APK with Gradle
        run: |
          cd /tmp/cap-project/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          cp "$APK_PATH" "$GITHUB_WORKSPACE/JivanOS.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/JivanOS.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/JivanOS.apk"

      - name: Upload JivanOS.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JivanOS-Android-APK
          path: JivanOS.apk
          if-no-files-found: error

      - name: Publish JivanOS.apk to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk JivanOS.apk \
            --title "JivanOS Android APK (v${JIVANOS_VER_NAME:-3.0.1})" \
            --notes "## JivanOS v${JIVANOS_VER_NAME:-3.0.1} (Build ${JIVANOS_VER_CODE:-30001})

- **In-Place Updates**: Explicit v1/v2 APK signature pinning (`com.jivanos.lifesystem`) ensures seamless future updates without uninstalling.
- **Note when upgrading from legacy v2.1.x APKs**: If your currently installed v2.1.x APK was built with an older mismatched keystore, Android will show a one-time package conflict error. Export a JSON backup (or sync to a drive), uninstall the old v2.1.x APK once, and install v3.0.x — every update after this will install cleanly in-place.
- **What's New**: Joplin-style Multi-Drive Sync + JivanOS Private Sync Vault, Check Config diagnostics, overhauled Settings & Profile hub, and updated JivanOS emblem."
