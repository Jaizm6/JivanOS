name: Build JivanOS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK 34
        run: |
          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
            sudo chown -R $USER:$USER "$SDK_ROOT"
          else
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager | head -n 1)
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Dependencies, Generate GrapheneOS Icons & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps react-is postcss
          node -e '
            const sharp = require("sharp");
            const fs = require("fs");
            const svg = fs.readFileSync("public/icon.svg");
            Promise.all([
              sharp(svg).resize(64, 64).png().toFile("public/favicon.png"),
              sharp(svg).resize(180, 180).png().toFile("public/apple-touch-icon.png"),
              sharp(svg).resize(192, 192).png().toFile("public/pwa-192x192.png"),
              sharp(svg).resize(512, 512).png().toFile("public/pwa-512x512.png"),
              sharp(svg).resize(512, 512).png().toFile("public/pwa-maskable-512x512.png")
            ]).then(() => console.log("Web & PWA icons generated from public/icon.svg"));
          '
          npm run build

      - name: Package Web Bundle into Native Android Project (Capacitor 6)
        run: |
          rm -rf /tmp/cap-project
          mkdir -p /tmp/cap-project
          cp -r "$GITHUB_WORKSPACE/dist" /tmp/cap-project/dist
          cp "$GITHUB_WORKSPACE/capacitor.config.json" /tmp/cap-project/capacitor.config.json
          cd /tmp/cap-project
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap add android
          npx cap sync android

          # Apply GrapheneOS custom launcher icon across all Android mipmap densities
          node -e '
            const sharp = require("'"$GITHUB_WORKSPACE"'/node_modules/sharp");
            const fs = require("fs");
            const path = require("path");
            const svg = fs.readFileSync("'"$GITHUB_WORKSPACE"'/public/icon.svg");
            const resDir = "/tmp/cap-project/android/app/src/main/res";
            const mipmaps = [
              { dir: "mipmap-mdpi", size: 48, fg: 108 },
              { dir: "mipmap-hdpi", size: 72, fg: 162 },
              { dir: "mipmap-xhdpi", size: 96, fg: 216 },
              { dir: "mipmap-xxhdpi", size: 144, fg: 324 },
              { dir: "mipmap-xxxhdpi", size: 192, fg: 432 },
            ];
            (async () => {
              for (const m of mipmaps) {
                const targetDir = path.join(resDir, m.dir);
                fs.mkdirSync(targetDir, { recursive: true });
                await sharp(svg).resize(m.size, m.size).png().toFile(path.join(targetDir, "ic_launcher.png"));
                await sharp(svg).resize(m.size, m.size).png().toFile(path.join(targetDir, "ic_launcher_round.png"));
                await sharp(svg).resize(m.fg, m.fg).png().toFile(path.join(targetDir, "ic_launcher_foreground.png"));
              }
              const bgXml = path.join(resDir, "values/ic_launcher_background.xml");
              if (fs.existsSync(bgXml)) {
                fs.writeFileSync(bgXml, "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"ic_launcher_background\">#090D16</color>\n</resources>\n");
              }
              console.log("Android native mipmap launcher icons updated with GrapheneOS emblem.");
            })();
          '

          # Auto-increment versionCode & versionName and configure deterministic signing so APKs update in-place without uninstalling
          VER_CODE=$((100 + ${GITHUB_RUN_NUMBER:-1}))
          VER_NAME="2.1.${GITHUB_RUN_NUMBER:-1}"
          BUILD_GRADLE="/tmp/cap-project/android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i "s/versionCode 1/versionCode ${VER_CODE}/g" "$BUILD_GRADLE"
            sed -i "s/versionName \"1.0\"/versionName \"${VER_NAME}\"/g" "$BUILD_GRADLE"
          fi

          # Ensure persistent deterministic debug keystore so every GitHub Actions build shares the same certificate
          mkdir -p "$HOME/.android"
          if [ -f "$GITHUB_WORKSPACE/android-signing/debug.keystore.b64" ]; then
            base64 -d "$GITHUB_WORKSPACE/android-signing/debug.keystore.b64" > "$HOME/.android/debug.keystore"
          fi

          MANIFEST="/tmp/cap-project/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application|g' "$MANIFEST"
          fi

      - name: Compile Installable Android APK with Gradle
        run: |
          cd /tmp/cap-project/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/JivanOS.apk"
          ls -lh "$GITHUB_WORKSPACE/JivanOS.apk"

      - name: Upload JivanOS.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JivanOS-Android-APK
          path: JivanOS.apk
          if-no-files-found: error

      - name: Publish JivanOS.apk to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk JivanOS.apk \
            --title "JivanOS Android APK (v2.1.${GITHUB_RUN_NUMBER:-1})" \
            --notes "Download JivanOS.apk below under Assets on your Android phone and tap it to install or update in-place over your existing JivanOS app."
