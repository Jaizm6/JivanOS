name: Build Tauri Desktop Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows (.msi + .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build Tauri Windows installers (.msi & NSIS .exe)
        run: npm run tauri:build
        env:
          CI: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JivanOS-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish Windows installers (.msi & .exe) to GitHub Releases
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No Windows installer files found to publish."
            exit 0
          fi

          TAG="latest-apk"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${FILES[@]}" \
              --title "JivanOS Multi-Platform Release (Android, Windows, Linux)" \
              --notes "Official JivanOS builds for Android (.apk / .aab), Windows (.msi / .exe), and Linux (.AppImage / .deb)."
          else
            gh release upload "$TAG" "${FILES[@]}" --clobber
          fi

  build-linux:
    name: Build Linux (.AppImage + .deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri v2 & libsecret dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libfuse2 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libsecret-1-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build Tauri Linux bundles (.AppImage & .deb)
        run: npm run tauri:build
        env:
          CI: true
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JivanOS-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Publish Linux bundles (.AppImage & .deb) to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No Linux bundle files found to publish."
            exit 0
          fi

          TAG="latest-apk"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${FILES[@]}" \
              --title "JivanOS Multi-Platform Release (Android, Windows, Linux)" \
              --notes "Official JivanOS builds for Android (.apk / .aab), Windows (.msi / .exe), and Linux (.AppImage / .deb)."
          else
            gh release upload "$TAG" "${FILES[@]}" --clobber
          fi


