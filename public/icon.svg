<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Indigo-Violet Gradient for Deep Tactile Contrast -->
    <linearGradient id="jivanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="45%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Subtle Inner Rim Highlight -->
    <linearGradient id="innerRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Checkmark Fill/Stroke Gradient -->
    <linearGradient id="checkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Ring Track Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Checkmark -->
    <filter id="elevate" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Smooth Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#jivanBg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#innerRim)" stroke-width="4" />

  <!-- Outer Vitality Ring Track -->
  <circle
    cx="256"
    cy="256"
    r="164"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-dasharray="770 260"
    transform="rotate(-85 256 256)"
  />

  <!-- Top Vitality Momentum Dot -->
  <circle cx="256" cy="92" r="17" fill="#ffffff" filter="url(#elevate)" />

  <!-- Iconic Bold Modern Checkmark -->
  <path
    d="M 186 262 L 236 314 L 332 208"
    fill="none"
    stroke="url(#checkGlow)"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#elevate)"
  />
</svg>
