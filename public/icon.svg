<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gStroke" x1="96" y1="72" x2="416" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="55%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="gCore" x1="176" y1="152" x2="336" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Minimal GrapheneOS-Inspired Squircle Carbon Shield -->
  <rect width="512" height="512" rx="118" fill="url(#gBg)" />
  <rect x="18" y="18" width="476" height="476" rx="102" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" />

  <!-- Outer Hexagonal Graphene Lattice Ring -->
  <polygon
    points="256,84 405,170 405,342 256,428 107,342 107,170"
    stroke="url(#gStroke)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Inner Graphene Bond Spokes (Y-Lattice) -->
  <line x1="256" y1="84" x2="256" y2="178" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" />
  <line x1="405" y1="342" x2="324" y2="295" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" />
  <line x1="107" y1="342" x2="188" y2="295" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" />

  <!-- Inner Core Hexagon ("G / J" Open Graphene Ring) -->
  <path
    d="M324 217 L256 178 L188 217 L188 295 L256 334 L324 295 L324 256 L268 256"
    stroke="url(#gCore)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- 6 Atomic Carbon Vertex Nodes + Center Nucleus -->
  <circle cx="256" cy="84" r="16" fill="#F8FAFC" />
  <circle cx="405" cy="170" r="16" fill="#F8FAFC" />
  <circle cx="405" cy="342" r="16" fill="#CBD5E1" />
  <circle cx="256" cy="428" r="16" fill="#818CF8" />
  <circle cx="107" cy="342" r="16" fill="#CBD5E1" />
  <circle cx="107" cy="170" r="16" fill="#F8FAFC" />
  <circle cx="256" cy="256" r="15" fill="#F43F5E" />
</svg>
