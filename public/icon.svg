<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="jivanCanvas" x1="48" y1="24" x2="464" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131C31" />
      <stop offset="55%" stop-color="#0B101D" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <radialGradient id="jivanAmbient" cx="38%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070A12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jivanOrb" x1="170" y1="148" x2="238" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="52%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="jivanStem" x1="326" y1="150" x2="188" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Minimal Obsidian Squircle Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#jivanCanvas)" />
  <rect width="512" height="512" rx="120" fill="url(#jivanAmbient)" />
  <rect
    x="1.5"
    y="1.5"
    width="509"
    height="509"
    rx="118.5"
    stroke="#FFFFFF"
    stroke-opacity="0.09"
    stroke-width="3"
  />

  <!-- Sculptural Minimalist "J" Monogram (centered inside Android adaptive safe zone) -->
  <path
    d="M326 154 V276 A74 74 0 0 1 184 307"
    stroke="url(#jivanStem)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Luminous Vitality Orb (Life / Continuity / O of OS) -->
  <circle cx="204" cy="182" r="34" fill="url(#jivanOrb)" />
</svg>
