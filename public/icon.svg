<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="jBg" x1="24" y1="16" x2="488" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="55%" stop-color="#131A35" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="jRing" x1="88" y1="88" x2="424" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="jMark" x1="176" y1="112" x2="340" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="52%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="jPulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Crisp Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#jBg)" />
  <rect x="20" y="20" width="472" height="472" rx="100" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4" />

  <!-- Subtle Orbital Continuity Arc -->
  <circle
    cx="256"
    cy="256"
    r="168"
    stroke="url(#jRing)"
    stroke-width="14"
    stroke-dasharray="760 295"
    stroke-dashoffset="65"
    stroke-linecap="round"
  />

  <!-- Stylized Geometric "J" Stem & Hook -->
  <path
    d="M294 128 V288 C294 342 252 380 198 380 C166 380 140 364 126 340"
    stroke="url(#jMark)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top Horizon Bar on "J" -->
  <line
    x1="218"
    y1="128"
    x2="338"
    y2="128"
    stroke="#F8FAFC"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- Vitality Beacon Dot -->
  <circle cx="372" cy="186" r="24" fill="url(#jPulse)" />
  <circle cx="372" cy="186" r="9" fill="#ECFDF5" />
</svg>
